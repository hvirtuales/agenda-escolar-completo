; Ajustes de PHP para Agenda Escolar (el archivo más grande que se sube es de 20 MB: recursos y adjuntos del cuaderno).
date.timezone = America/Bogota
memory_limit = 256M
upload_max_filesize = 24M
post_max_size = 28M
max_execution_time = 120
expose_php = Off
display_errors = Off
log_errors = On

session.cookie_httponly = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Sesiones: CodeIgniter fija las cookies (Secure automático con HTTPS en Config\Cookie); esto cubre a PHP por debajo.
session.use_strict_mode = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1

; La aplicación no ejecuta comandos del sistema.
disable_functions = exec,shell_exec,system,passthru,proc_open,popen
