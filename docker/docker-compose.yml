# Agenda Escolar con Docker: la aplicación (PHP + Apache) y MariaDB.
# Uso (desde esta carpeta docker/):
#   cp .env.example .env      # y cambie las contraseñas
#   docker compose up -d --build
#   abra http://localhost:8080/install.php   (servidor de base de datos: db)
name: agenda-escolar

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agenda-escolar:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      AUTO_MIGRATE: "${AUTO_MIGRATE:-0}"
    volumes:
      - app_data:/var/www/html/writable   # .env, sesiones, registros y archivos de los colegios
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_NAME:-educai}"
      MARIADB_USER: "${DB_USER:-educai}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD en docker/.env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en docker/.env}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  app_data:
  db_data:
