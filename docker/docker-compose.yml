# Agenda Escolar con Docker: la aplicación (PHP 8.4 + Apache) y MariaDB.
# Uso (desde esta carpeta docker/):
#   cp .env.example .env      # y cambie las contraseñas
#   docker compose up -d --build
#   abra https://agendaescolar.co/install.php   (servidor de base de datos: agenda-escolar-db)
# HTTPS: lo da el Caddy que ya corre en el VPS (proyecto ai-specialists). La app se une a su red con el alias
# «agenda-escolar-app» y no publica puertos; ver docker/caddy/agendaescolar.caddy.
name: agenda-escolar

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agenda-escolar:latest
    restart: unless-stopped
    environment:
      APP_URL: "${APP_URL:-https://agendaescolar.co/}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.16.0.0/12}"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-0}"
    volumes:
      - app_data:/var/www/html/writable   # .env, sesiones, registros y archivos de los colegios
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                              # lo mínimo para el arranque (chown, cambio a www-data) y Apache en el puerto 80
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    networks:
      default:
      proxy:
        aliases:
          - agenda-escolar-app            # nombre único en la red compartida (otros proyectos pueden tener un «app»)
    depends_on:
      db:
        condition: service_healthy

  db:
    # Versión fijada con su huella; para actualizar, cambie ambas y: docker compose pull db && docker compose up -d
    image: mariadb:11.4.13@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_NAME:-educai}"
      MARIADB_USER: "${DB_USER:-educai}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD en docker/.env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en docker/.env}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    networks:
      default:
        aliases:
          - agenda-escolar-db             # nombre único: la app también está en la red compartida, donde otro proyecto puede tener un «db»
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  default:                                # red interna: app ↔ db (la base de datos no sale de aquí)
  proxy:                                  # red del Caddy existente
    external: true
    name: "${PROXY_NETWORK:-ai-specialists_default}"

volumes:
  app_data:
  db_data:
