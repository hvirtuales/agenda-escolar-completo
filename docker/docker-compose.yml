# Agenda Escolar con Docker: solo la aplicación (PHP 8.4 + Apache). La base de datos es la MariaDB compartida del VPS
# (docker/db-compartida/, montada en /docker/db-compartida). Lo más fácil es instalar con: ./instalar.sh
#
# - HTTPS: lo da el Caddy que ya corre en el VPS. La app se une a su red (PROXY_NETWORK) con el alias
#   «agenda-escolar-app» y no publica puertos (bloque para el Caddyfile: docker/caddy/agendaescolar.caddy).
# - Base de datos: la app se une a la red «db-compartida», donde la base responde como «db-compartida».
# - Alternativa con MariaDB propia: docker-compose.db-propia.yml (COMPOSE_FILE en docker/.env).
#   Mantenga el servicio «app» igual en los dos archivos.
name: agenda-escolar

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agenda-escolar:latest
    restart: unless-stopped
    environment:
      APP_URL: "${APP_URL:-https://agendaescolar.co/}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.16.0.0/12}"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-0}"
      # Solo para proponer los datos en el instalador (la contraseña se escribe a mano)
      DB_HOST: db-compartida
      DB_NAME: "${DB_NAME:-educai}"
      DB_USER: "${DB_USER:-educai}"
    volumes:
      - app_data:/var/www/html/writable   # .env, sesiones, registros y archivos de los colegios
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                              # lo mínimo para el arranque (chown, cambio a www-data) y Apache en el puerto 80
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    networks:
      proxy:
        aliases:
          - agenda-escolar-app            # nombre único en la red compartida (otros proyectos pueden tener un «app»)
      basedatos: {}

networks:
  proxy:                                  # red del Caddy existente
    external: true
    name: "${PROXY_NETWORK:-ai-specialists_default}"
  basedatos:                              # red de la MariaDB compartida
    external: true
    name: "${DB_NETWORK:-db-compartida}"

volumes:
  app_data:
